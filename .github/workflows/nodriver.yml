name: Nodriver Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-nodriver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable libgbm1 libasound2t64
      - name: Test Chrome Startup
        run: |
          google-chrome --version
          google-chrome --headless --no-sandbox --disable-gpu --dump-dom https://example.com
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nodriver

      - name: Run Automation Script
        run: python test_script.py

      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nodriver-result
          path: nodriver_final.png
