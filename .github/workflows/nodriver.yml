name: Nodriver Automation
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-nodriver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Google Chrome & Display Server
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb libgbm1 libasound2t64

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          else
            echo "Error: requirements.txt not found!"
            exit 1
          fi

      - name: Run script
        run: |
          # xvfb-run provides the virtual monitor needed for 'headful' browsers in CI
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python test_script.py

      - name: Upload Result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nodriver-result
          path: nodriver_final.png
