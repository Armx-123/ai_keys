name: Nodriver Automation
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-nodriver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Google Chrome & Display Server
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Using your r.txt file here
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script with Virtual Display
        run: |
          # --server-args provides a standard screen size to prevent rendering issues
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python test_script.py

      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nodriver-screenshot
          path: nodriver_result.png
