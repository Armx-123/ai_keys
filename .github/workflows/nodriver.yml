name: Nodriver Automation
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-nodriver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Updated libasound2 to libasound2t64 for Ubuntu 24.04 compatibility
          sudo apt-get install -y google-chrome-stable xvfb libgbm1 libasound2t64

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          else
            echo "requirements.txt not found!"
            exit 1
          fi

      - name: Run with Xvfb
        run: |
          # Exporting display and running with a larger timeout buffer
          export DISPLAY=:99
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python test_script.py

      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nodriver-screenshot
          path: nodriver_result.png
