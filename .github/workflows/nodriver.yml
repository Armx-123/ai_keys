name: Nodriver Automation
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-nodriver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Google Chrome & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          else
            echo "requirements.txt not found!"
            exit 1
          fi

      - name: Run script with Virtual Display
        run: |
          # The sleep 5 gives Xvfb time to stabilize before the script starts
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" sh -c "sleep 5 && python test_script.py"

      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nodriver-screenshot
          path: nodriver_result.png
