name: Nodriver Automation
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-nodriver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb libgbm1 libasound2t64 dbus-x11

      - name: Install Python Libs
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Launch Chrome and Run
        run: |
          # 1. Start Xvfb and DBus
          export $(dbus-launch)
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          
          # 2. Start Chrome in background
          google-chrome \
            --remote-debugging-port=9222 \
            --remote-allow-origins=* \
            --no-sandbox \
            --disable-setuid-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --no-first-run \
            --no-zygote \
            --headless=new \
            --user-data-dir=/tmp/chrome-profile &
          
          echo "Waiting for Chrome DevTools..."
          sleep 20
          
          # 3. Run the script
          python test_script.py
          
          # 4. Cleanup
          pkill google-chrome

      - name: Upload Result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nodriver-result
          path: nodriver_final.png
